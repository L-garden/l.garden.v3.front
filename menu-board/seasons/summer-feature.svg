<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
<style>.sun{transform-origin:200px 55px;animation:rot 12s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.cup{transform-origin:125px 270px;animation:wb 3s ease-in-out infinite}@keyframes wb{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.t{animation:tw 1.6s ease-in-out infinite}.t2{animation-delay:.8s}@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}</style>
<g class="sun"><circle cx="200" cy="55" r="22" fill="#ffcf4a"/><g stroke="#ffcf4a" stroke-width="4" stroke-linecap="round"><path d="M200 20v-8M200 90v8M165 55h-8M235 55h8M175 30l-6-6M225 80l6 6M225 30l6-6M175 80l-6 6"/></g></g>
<g class="cup"><path d="M70 170h110l-14 90H84z" fill="#c8e4f7" opacity=".8"/><path d="M60 170q65-90 130 0z" fill="#fff" stroke="#c8e4f7" stroke-width="3"/>
<path d="M85 150q40-40 80 0" fill="#ffd966"/><circle cx="125" cy="118" r="18" fill="#fff6e0"/><path d="M118 100q4-14 14-12" stroke="#64bb68" stroke-width="4" fill="none"/><ellipse cx="100" cy="160" rx="10" ry="6" fill="#fa6868"/><ellipse cx="150" cy="158" rx="10" ry="6" fill="#ff894f"/></g>
<path class="t" d="M40 120l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#77bef0"/><path class="t t2" d="M215 160l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#77bef0"/>
</svg>
