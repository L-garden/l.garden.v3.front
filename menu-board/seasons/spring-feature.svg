<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
<style>.br{transform-origin:250px 20px;animation:sw 4s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
