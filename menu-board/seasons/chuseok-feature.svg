<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
<style>
.moon{transform-origin:125px 110px;animation:gl 4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}
.cl{animation:dr 9s ease-in-out infinite}.cl2{animation-delay:-4.5s}
@keyframes dr{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}
.st{animation:tw 2s ease-in-out infinite}.st2{animation-delay:1s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
</style>
<circle class="moon" cx="125" cy="110" r="78" fill="#ffe9a8"/>
<circle cx="125" cy="110" r="60" fill="#ffd966"/>
<g fill="#f2c94c" opacity=".55"><circle cx="105" cy="95" r="9"/><circle cx="145" cy="125" r="12"/><circle cx="130" cy="85" r="5"/></g>
<g class="cl" fill="#fff"><ellipse cx="70" cy="150" rx="34" ry="11"/><ellipse cx="88" cy="141" rx="18" ry="10"/></g>
<g class="cl cl2" fill="#fff"><ellipse cx="185" cy="72" rx="30" ry="9"/><ellipse cx="172" cy="64" rx="15" ry="9"/></g>
<path class="st" d="M30 40l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#ffcf4a"/><path class="st st2" d="M220 175l1.6 4.8 4.8 1.6-4.8 1.6-1.6 4.8-1.6-4.8-4.8-1.6 4.8-1.6z" fill="#ffcf4a"/>
<ellipse cx="125" cy="262" rx="80" ry="16" fill="#7b542f" opacity=".85"/><ellipse cx="125" cy="256" rx="80" ry="14" fill="#a8763e"/>
<g stroke="#fff" stroke-width="1" opacity=".95"><path d="M78 252q16-26 32 0z" fill="#f7f0e3"/><path d="M106 248q18-28 36 0z" fill="#e7b6c8"/><path d="M138 252q16-26 32 0z" fill="#b9dba0"/><path d="M92 258q15-22 30 0z" fill="#ffd966"/><path d="M128 258q15-22 30 0z" fill="#f7f0e3"/></g>
</svg>
