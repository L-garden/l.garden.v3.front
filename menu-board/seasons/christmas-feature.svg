<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
<style>
.star{transform-origin:125px 34px;animation:sp 2.4s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(12deg)}}
.l{animation:tw 1.6s ease-in-out infinite}.l:nth-child(2n){animation-delay:.5s}.l:nth-child(3n){animation-delay:1s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.s{animation:fall 7s linear infinite}.s2{animation-delay:-2.3s}.s3{animation-delay:-4.6s}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(300px)}}
</style>
<g fill="#c8e4f7"><g class="s"><circle cx="30" cy="0" r="3"/><circle cx="210" cy="40" r="2.5"/><circle cx="120" cy="-60" r="2"/></g><g class="s s2"><circle cx="60" cy="10" r="2"/><circle cx="190" cy="-30" r="3"/></g><g class="s s3"><circle cx="20" cy="-40" r="2.5"/><circle cx="235" cy="0" r="2"/></g></g>
