<path d="M125 50 60 140h28l-40 60h32l-42 58h87z" fill="#64bb68"/>
<g><circle class="l" cx="100" cy="125" r="5" fill="#fa6868"/><circle class="l" cx="148" cy="118" r="5" fill="#ffcf4a"/><circle class="l" cx="85" cy="185" r="5" fill="#77bef0"/><circle class="l" cx="160" cy="178" r="5" fill="#fa6868"/><circle class="l" cx="122" cy="160" r="5" fill="#ffcf4a"/><circle class="l" cx="70" cy="240" r="5" fill="#ffcf4a"/><circle class="l" cx="125" cy="228" r="5" fill="#77bef0"/><circle class="l" cx="182" cy="238" r="5" fill="#fa6868"/></g>
