.st{animation:tw 1.6s ease-in-out infinite}.st:nth-child(2){animation-delay:.5s}.st:nth-child(3){animation-delay:1s}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.6)}}
</style>
