<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 300">
<style>
.glow{animation:fl 1.3s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:1}30%{opacity:.55}60%{opacity:.9}80%{opacity:.6}}
.pk{transform-origin:125px 270px;animation:wb 3s ease-in-out infinite}
@keyframes wb{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.fly{animation:fly 6s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(60px,-15px)}50%{transform:translate(120px,5px)}75%{transform:translate(60px,20px)}100%{transform:translate(0,0)}}
</style>
<circle cx="200" cy="55" r="32" fill="#ffe9a8"/><circle cx="214" cy="47" r="30" fill="#fff"/>
<g class="fly"><path d="M50 70c-4 0-6 4-8 6-4-4-10-4-15 0 4 1 6 5 6 9 4-3 9-3 12 0 1-3 3-4 5-4s4 1 5 4c3-3 8-3 12 0 0-4 2-8 6-9-5-4-11-4-15 0-2-2-4-6-8-6z" fill="#3b2e4a"/></g>
<g class="pk">
<path d="M122 150c0-12 6-20 14-24" stroke="#4f9d58" stroke-width="7" fill="none" stroke-linecap="round"/>
<ellipse cx="88" cy="210" rx="50" ry="60" fill="#e8742f"/><ellipse cx="162" cy="210" rx="50" ry="60" fill="#e8742f"/><ellipse cx="125" cy="210" rx="50" ry="62" fill="#ff894f"/>
<g class="glow" fill="#ffcf4a"><path d="M88 185l18 0-9 18z"/><path d="M144 185l18 0-9 18z"/><path d="M78 228q47 36 94 0l-12 4-8-8-10 10-12-10-12 10-10-10-8 8z"/></g>
</g>
</svg>
